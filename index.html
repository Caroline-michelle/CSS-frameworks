<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Memo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body
    class="min-h-screen bg-cover bg-center flex items-center justify-center relative antialiased"
    style="background-image: url('/images/login-bakgrunn2.jpg')"
  >
    <div class="absolute inset-0 bg-[#b18fe3]/30 backdrop-blur-[1px]"></div>

    <div
      class="relative z-10 w-[92%] max-w-md rounded-2xl p-8 bg-white/15 backdrop-blur-xl border border-white/20 shadow-[0_8px_30px_-10px_rgba(0,0,0,0.45)]"
    >
      <div class="flex justify-center mb-6">
        <div
          class="w-16 h-16 rounded-full bg-[#bda8ff] flex items-center justify-center ring-4 ring-[#bda8ff]/40 hover:ring-[#c4b5fd]/60 hover:brightness-110 hover:scale-105 transition-all duration-300"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="white"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a8.25 8.25 0 1115 0v.75H4.5v-.75z"
            />
          </svg>
        </div>
      </div>

      <h1
        class="text-center text-2xl font-semibold tracking-tight text-[#f4efff]"
      >
        Login
      </h1>
      <div
        class="w-16 h-[2px] bg-[#d8c9ff] mx-auto mb-6 rounded-full opacity-70"
      ></div>

      <div class="mt-4 mb-6 h-px bg-white/20"></div>

      <form action="/feed/index.html" method="POST" class="space-y-4">
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-[#ece4ff] mb-1"
            >Email</label
          >
          <input
            id="email"
            name="email"
            type="email"
            required
            class="w-full p-3 rounded-md bg-white/10 border border-white/25 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-[#c7b3f8]/60 transition"
            placeholder="you@example.com"
          />
        </div>
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-[#ece4ff] mb-1"
            >Password</label
          >
          <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            required
            class="w-full p-3 rounded-md bg-white/10 border border-white/25 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-[#c7b3f8]/60 transition"
            placeholder="Min. 8 characters"
          />
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="inline-flex items-center gap-2 text-white/80">
            <input type="checkbox" class="accent-[#b18fe3]" />
            <span>Remember me</span>
          </label>
          <a
            href="#"
            class="text-[#d8c9ff] hover:text-[#ede4ff] font-medium transition drop-shadow-[0_0_2px_rgba(0,0,0,0.2)]"
          >
            Forgot password?
          </a>
        </div>

        <button
          type="submit"
          class="w-full bg-[#bda8ff] py-3 rounded-md font-medium text-white ring-2 ring-[#bda8ff]/30 hover:ring-[#c4b5fd]/60 hover:bg-[#c4b5fd] hover:scale-[1.02] hover:brightness-110 transition-all duration-300"
        >
          Login
        </button>

        <p class="text-center text-sm mt-4 text-[#ede8ff]">
          Don’t have an account?
          <a
            href="/register"
            class="font-medium text-[#d8c9ff] hover:text-[#ede4ff] transition drop-shadow-[0_0_2px_rgba(0,0,0,0.2)]"
          >
            Register
          </a>
        </p>
      </form>
    </div>
  </body>
</html>
